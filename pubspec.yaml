name: manatal
description: >-
  Dart & Flutter SDK for the Manatal ATS Open API. Build a Manatal mobile app
  with API client, paginated list widgets, auth, and retries in one package.
version: 0.1.5
homepage: https://github.com/TasfiqulGhani/manatal-dart
repository: https://github.com/TasfiqulGhani/manatal-dart
issue_tracker: https://github.com/TasfiqulGhani/manatal-dart/issues
documentation: https://developers.manatal.com/reference/getting-started

environment:
  sdk: ^3.3.0
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
  test: ^1.25.0

topics:
  - manatal
  - ats
  - api
  - flutter
  - recruiting

screenshots:
  - description: 'Animated demo of the Manatal Flutter example app walkthrough.'
    path: screenshots/demo.gif
  - description: 'Example app dashboard with candidates and jobs overview.'
    path: screenshots/home.PNG
  - description: 'Paginated candidates list powered by ManatalCandidateList.'
    path: screenshots/candidates.PNG
  - description: 'Candidate detail screen loaded from the Manatal Open API.'
    path: screenshots/candidate_detail.PNG
  - description: 'Paginated jobs list powered by ManatalJobList.'
    path: screenshots/jobs.PNG
  - description: 'Job detail screen with organization and position info.'
    path: screenshots/job_detail.PNG
  - description: 'Create candidate form in the example Manatal mobile app.'
    path: screenshots/create_candidate.PNG
  - description: 'Create candidate form filled with sample candidate data.'
    path: screenshots/create_candidate_form_filled.PNG
  - description: 'Create job form in the example Manatal Flutter app.'
    path: screenshots/create_job.PNG
