name: manatal
description: >-
  Dart & Flutter SDK for the Manatal ATS Open API. Build a Manatal mobile app
  with API client, paginated list widgets, auth, and retries in one package.
version: 0.1.3
homepage: https://github.com/TasfiqulGhani/manatal-dart
repository: https://github.com/TasfiqulGhani/manatal-dart
issue_tracker: https://github.com/TasfiqulGhani/manatal-dart/issues
documentation: https://developers.manatal.com/reference/getting-started

environment:
  sdk: ^3.3.0
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
  test: ^1.25.0

topics:
  - manatal
  - manatal-app
  - ats
  - api
  - flutter
  - flutter-app
  - mobile
  - mobile-app
  - widgets
  - recruiting
  - hr
